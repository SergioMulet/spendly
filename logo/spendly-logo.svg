<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F38"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE38F"/>
      <stop offset="1" stop-color="#2FA55B"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#F2F2F7"/>

  <!-- shadow -->
  <ellipse cx="512" cy="842" rx="250" ry="26" fill="#000000" opacity="0.12"/>

  <g transform="rotate(-5 512 500)">
    <!-- legs -->
    <rect x="388" y="660" width="62" height="120" rx="31" fill="#1F8F4C"/>
    <rect x="574" y="660" width="62" height="120" rx="31" fill="#1F8F4C"/>
    <ellipse cx="410" cy="788" rx="52" ry="26" fill="#1A7A40"/>
    <ellipse cx="614" cy="788" rx="52" ry="26" fill="#1A7A40"/>

    <!-- arms -->
    <rect x="130" y="470" width="110" height="52" rx="26" fill="#1F8F4C"/>
    <rect x="784" y="470" width="110" height="52" rx="26" fill="#1F8F4C"/>

    <!-- bill body -->
    <rect x="192" y="290" width="640" height="400" rx="52" fill="url(#bill)"/>
    <rect x="222" y="320" width="580" height="340" rx="34" fill="none" stroke="#1F8F4C" stroke-width="6" opacity="0.7"/>

    <!-- corner numerals -->
    <text x="262" y="414" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="96" fill="#1A7A40">5</text>
    <text x="710" y="620" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="96" fill="#1A7A40">5</text>

    <!-- face -->
    <ellipse cx="438" cy="470" rx="28" ry="42" fill="#1B1F27"/>
    <ellipse cx="586" cy="470" rx="28" ry="42" fill="#1B1F27"/>
    <circle cx="448" cy="454" r="10" fill="#fff"/>
    <circle cx="596" cy="454" r="10" fill="#fff"/>
    <ellipse cx="380" cy="548" rx="30" ry="18" fill="#F4A3A3" opacity="0.7"/>
    <ellipse cx="644" cy="548" rx="30" ry="18" fill="#F4A3A3" opacity="0.7"/>
    <path d="M462 548 Q512 598 562 548" fill="none" stroke="#1B1F27" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
